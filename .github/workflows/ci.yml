name: CI

# Type check, the database access tests, and a production build on every push to main
# and every pull request. No secrets are needed: vite.config.ts requires no environment
# variables, and the app degrades gracefully when the Supabase ones are absent.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, database tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Database access tests
        run: npm run test:db

      - name: Build
        run: npm run build
